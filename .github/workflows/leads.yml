name: Daily Leads Extraction

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  extract-leads:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e .

      - name: Run leads ingester
        run: python -m src.extract.leads_ingester --source "PR Newswire - Venture Capital" --write --limit 16

      # Notify on failure: open a GitHub issue (or comment on the open one, so
      # repeated daily failures don't pile up). Issues notify the repo owner
      # through normal GitHub notifications, independent of the per-account
      # "failed workflow" email setting -- which didn't fire when an expired
      # ANTHROPIC_API_KEY broke leads extraction for five days unnoticed.
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Daily Leads Extraction workflow failing"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
              --body "Run failed: $RUN_URL. Close this issue once fixed."
          fi
