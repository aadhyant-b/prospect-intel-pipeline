name: Daily Leads Extraction

on:
  schedule:
    - cron: "0 1,7,13,19 * * *"
  workflow_dispatch:

jobs:
  extract-leads:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e .

      - name: Run leads ingester
        run: python -m src.extract.leads_ingester --source "PR Newswire - Venture Capital" --write --limit 8
