[project]
name = "press-release-intel"
version = "0.1.0"
description = "Press-release prospect intelligence pipeline"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "supabase",
    "httpx",
    "feedparser",
    "rapidfuzz",
    "python-dotenv",
    "anthropic",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src"]
